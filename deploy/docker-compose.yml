services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: draftfly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: draftfly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draftfly -d draftfly"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://draftfly:${POSTGRES_PASSWORD}@db:5432/draftfly
      PORT: "8080"
      NODE_ENV: production
      STATIC_APP_DIR: /srv/static/app
      STATIC_LANDING_DIR: /srv/static/landing
    depends_on:
      db:
        condition: service_healthy

  # One-off schema sync: docker compose --profile setup run --rm migrate
  migrate:
    profiles: ["setup"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: build
    env_file: .env
    environment:
      DATABASE_URL: postgres://draftfly:${POSTGRES_PASSWORD}@db:5432/draftfly
    command: ["pnpm", "--filter", "@workspace/db", "run", "push-force"]
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
